name: tam_app
description: منصة تم التعليمية - TAM Educational Platform
publish_to: none
version: 1.0.0+6

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase — Auth + FCM + Firestore + Storage + Functions
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  firebase_messaging: ^15.2.5
  cloud_firestore: ^5.6.8
  firebase_storage: ^12.4.5
  cloud_functions: ^5.4.5

  # Auth Providers
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^8.1.0

  # State Management
  provider: ^6.1.2

  # Camera & Image
  camera: ^0.12.0+2
  image_picker: ^1.1.2
  image: ^4.2.0

  # Video & PDF
  video_player: ^2.9.3
  chewie: ^1.8.5
  flutter_pdfview: ^1.3.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  http: ^1.2.2

  # In-App Purchase
  in_app_purchase: ^3.2.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # UI & Utils
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  flutter_markdown: ^0.7.6
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.4
  permission_handler: ^11.3.1
  device_info_plus: ^11.3.3

  # Screen Protection (prevent screenshots/screen recording)
  screen_protector: ^1.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_light.png
    - assets/images/logo_dark.png
    - assets/icons/3d/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/static/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/Cairo-Black.ttf
          weight: 900
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
